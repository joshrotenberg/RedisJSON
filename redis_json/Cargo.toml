[package]
name = "redis_json"
version = "99.99.99"
authors = [
    "Aviv David <aviv.david@redis.com>",
    "Ephraim Feldblum <ephraim.feldblum@redis.com>",
    "Guy Korland <guy.korland@redis.com>",
    "Meir Shpilraien <meir@redis.com>",
    "Omer Shadmi <omer.shadmi@redis.com>",
]
edition.workspace = true
description = "JSON data type for Redis"
repository.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["redis", "json", "plugin"]
categories = ["database-implementations"]
homepage = "https://redis.io/docs/stack/json/"

[lib]
crate-type = ["cdylib", "rlib"]
name = "rejson"

[dependencies]
bitflags = "2"
bson.workspace = true
ijson.workspace = true
serde_json.workspace = true
serde.workspace = true
half = "2.0.0"
libc = "0.2"
redis-module ={ git="https://github.com/RedisLabsModules/redismodule-rs", tag="v2.1.3", default-features = false, features = ["min-redis-compatibility-version-7-4"] }
redis-module-macros = { git="https://github.com/RedisLabsModules/redismodule-rs", tag="v2.1.3" }
itertools = "0.13"
jmespath = { version = "0.4", optional = true }
json_path = { path = "../json_path" }
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
crc32fast = { version = "1.4", optional = true }
base64 = { version = "0.22", optional = true }
urlencoding = { version = "2.1", optional = true }
regex = { version = "1.10", optional = true }
linkme = "0.3"
lazy_static = "1"

[features]
default = ["jmespath"]
as-library = []
thread_safe = ["ijson/thread_safe"]
jmespath = ["dep:jmespath", "dep:md-5", "dep:sha1", "dep:sha2", "dep:crc32fast", "dep:base64", "dep:urlencoding", "dep:regex"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "jmespath_cache"
harness = false
